name: Self-serve acceptance and preview
on:
  pull_request:
    paths: ['src/**', 'examples/**', 'build.zig*', 'selfserve.json', 'tools/selfserve.py', '.github/workflows/selfserve.yml']
  push:
    branches: [main]
    tags: ['selfserve-*']
  workflow_dispatch:
  schedule:
    - cron: '17 8 1 * *'
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: '0.16.0'
      - name: Check the repository visibility against the reviewed recipe
        env:
          REPO_VISIBILITY: ${{ github.event.repository.private && 'private' || 'public' }}
        run: |
          python3 -c 'import json,os; actual=os.environ["REPO_VISIBILITY"]; expected=json.load(open("selfserve.json"))["visibility"]; assert actual == expected, "Review selfserve.json before changing release visibility"'
      - name: Verify a clean committed source archive and package it
        run: python3 tools/selfserve.py selfserve.json --repo . --out "$RUNNER_TEMP/selfserve"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: selfserve-${{ runner.os }}-${{ runner.arch }}
          path: ${{ runner.temp }}/selfserve/
          if-no-files-found: error
  preview:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/selfserve-')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: selfserve-*
          path: packs
      - name: Bundle the verified platform packs
        run: |
          mkdir release-assets
          for pack in packs/selfserve-*; do
            tar -czf "release-assets/$(basename "$pack").tar.gz" -C "$pack" .
          done
          cd release-assets
          sha256sum *.tar.gz > SHA256SUMS
      - name: Publish a dated preview from the verified tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --prerelease \
            --title "$GITHUB_REF_NAME" \
            --notes "Both native acceptance jobs passed. Each pack contains committed source, a runnable fixture, recorded checks and SHA-256 digests. Read TRY.md and result.json for scope. No performance or production-use claim is implied." \
            release-assets/*
